# jenkins (192.0.2.16:8080): nowy host w 2. przebiegu; imitacja Jenkinsa (naglowki X-Jenkins*).
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Jenkins "2.401.1" always;
    add_header X-Hudson "1.395" always;
    add_header Set-Cookie "JSESSIONID.lab=node0abc; Path=/; HttpOnly" always;
}
