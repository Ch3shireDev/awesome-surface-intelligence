# web-prod (192.0.2.10): "produkcyjny" intranet z typowymi artefaktami do wykrycia.
server {
    listen 80;
    listen 443 ssl;
    ssl_certificate     /etc/nginx/tls/lab.crt;
    ssl_certificate_key /etc/nginx/tls/lab.key;
    root /usr/share/nginx/html;
    add_header X-Powered-By "PHP/7.4.33" always;
    add_header Set-Cookie "PHPSESSID=lab0123456789abcdef; Path=/; HttpOnly" always;
    location = /login { return 302 /index.html?login=1; }
}
