# wordpress (192.0.2.11): statyczna imitacja WordPressa (odciski: generator, wp-login, readme, cookie, Link api.w.org).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    add_header Link '<http://192.0.2.11/wp-json/>; rel="https://api.w.org/"' always;
    location = /wp-login.php {
        default_type text/html;
        add_header Set-Cookie "wordpress_test_cookie=WP%20Cookie%20check; Path=/" always;
        try_files /wp-login.html =404;
    }
}
