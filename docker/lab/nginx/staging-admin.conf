# staging-admin (192.0.2.12:8080): srodowisko testowe z panelem administracyjnym.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Environment "staging" always;
    add_header Set-Cookie "staging_session=s3cr3t-lab; Path=/" always;
    location = /version { default_type application/json; return 200 '{"app":"lab-portal","version":"2.3.1-rc1","env":"staging"}\n'; }
}
