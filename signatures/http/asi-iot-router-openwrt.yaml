id: asi-iot-router-openwrt
info:
  name: Router OpenWrt / LuCI
  author: asi
  severity: low
  description: Panel LuCI na routerze z OpenWrt. Sprawdzic, czy panel zarzadzania powinien byc widoczny z tej sieci.
  tags: asi,iot,router,openwrt,panel
http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/luci"
      - "{{BaseURL}}/luci/"
    stop-at-first-match: true # LAB-T12: one hit per port
    matchers-condition: and
    matchers:
      - type: status
        status: [200, 301, 302, 401, 403]
      - type: regex
        part: body
        # tylko w <title>: aplikacje, ktore odbijaja sciezke zadania w linkach (np. Adminer: href="luci?file=...")
        # dawaly falszywe trafienie na sam URL /cgi-bin/luci (LAB-4)
        regex: ['(?i)<title>[^<]*(luci|openwrt|lede)[^<]*</title>']
    extractors:
      - type: regex
        part: body
        group: 1
        regex: ['(?i)<title>([^<]{1,80})</title>']
