id: asi-phpmyadmin
info:
  name: Panel bazy danych phpMyAdmin
  author: asi
  severity: low
  description: Wystawiony panel phpMyAdmin. Tylko pasywna detekcja (GET), bez prob logowania.
  tags: asi,panel,database,phpmyadmin
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/index.php"
    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: regex
        part: header
        regex: ['(?im)^set-cookie:[^\r\n]*phpmyadmin=']
      - type: regex
        part: body
        regex: ['(?i)(<title>[^<]*phpmyadmin|pma_servername|pma_username|phpmyadmin\.net)']
    extractors:
      - type: regex
        part: body
        group: 1
        regex: ['(?i)phpMyAdmin[^0-9<\n]{0,20}([0-9]+\.[0-9]+(?:\.[0-9]+)?)']
