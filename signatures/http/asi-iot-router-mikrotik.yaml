id: asi-iot-router-mikrotik
info:
  name: Router MikroTik (RouterOS / WebFig)
  author: asi
  severity: low
  description: Panel WebFig RouterOS. Router brzegowy - jesli wystawiony na zewnatrz, to zwykle blad konfiguracji; sprawdzic wersje i dostep do zarzadzania.
  tags: asi,iot,router,mikrotik,panel
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/webfig/"
    stop-at-first-match: true # LAB-T12: one hit per port
    matchers-condition: or
    matchers:
      - type: regex
        part: body
        # tylko w <title> (WebFig: "RouterOS router configuration page"): strona 404 Apache cytuje zadany URL
        # "/webfig/" w tresci i dawala falszywe trafienie (LAB-4, DVWA)
        regex: ['(?i)<title>[^<]*(routeros|webfig|mikrotik)[^<]*</title>']
      - type: regex
        part: header
        regex: ['(?im)^server:\s*mikrotik']
    extractors:
      - type: regex
        part: body
        group: 1
        regex: ['(?i)(routeros\s*v?[0-9]+\.[0-9]+(?:\.[0-9]+)?)']
