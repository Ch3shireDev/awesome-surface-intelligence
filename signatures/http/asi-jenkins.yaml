id: asi-jenkins
info:
  name: Jenkins (serwer CI) dostępny w sieci
  author: asi
  severity: medium
  description: Nagłówek X-Jenkins / X-Hudson. Serwer CI ma zwykle dostęp do sekretów i kodu.
  tags: asi,ci,jenkins,panel
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers:
      - type: regex
        part: header
        regex: ['(?i)x-(jenkins|hudson):']
    extractors:
      - type: regex
        part: header
        group: 1
        regex: ['(?i)x-jenkins:\s*([0-9.]+)']
